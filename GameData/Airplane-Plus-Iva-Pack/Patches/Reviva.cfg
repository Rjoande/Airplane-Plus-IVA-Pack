// ----- APIP subtype description: all its interiors now use MAS props
// (Reviva's original text says "Medium Tech Analog")

@PART:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[IVASwitch]&@SUBTYPE[APIP]]]:NEEDS[Reviva&AvionicsSystems]:AFTER[Reviva]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[IVASwitch]]
	{
		@SUBTYPE[APIP]
		{
			@descriptionSummary = Airplane Plus IVA Pack (MAS)
			@descriptionDetail = Airplane Plus IVA Pack interior with ASET and MAS props.\n<color=green>Medium Tech Digital</color>
		}
	}
}
