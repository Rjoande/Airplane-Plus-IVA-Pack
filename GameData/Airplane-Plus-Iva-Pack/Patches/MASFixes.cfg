// ----- MAS 1.3.7 bug: the needle COLOR_SHIFT looks for ASI_arrow/TV_arrow (copied from the airspeed gauge),
// the ASET_DynamicPressure model only has DynPres_arrow -> NullReferenceException and "check the log" in flight.

@PROP[MAS_ASET_DynamicPressure]:NEEDS[AvionicsSystems]:FINAL
{
	@MODULE[MASComponent]
	{
		@COLOR_SHIFT:HAS[#name[DynPres_arrow]]
		{
			@transform = DynPres_arrow
		}
	}
}
