// ----- storedStrings for the standby page of the MAS MFDs (without them the MFD shows variable names).
// FINAL: MASFlightComputer is added by Reviva/2_Backstop/FlightComputers.cfg in LAST[Reviva].

@PART[fightercockpit]:HAS[@MODULE[MASFlightComputer]]:NEEDS[AirplanePlus&AvionicsSystems]:FINAL
{
	@MODULE[MASFlightComputer]
	{
		%PERSISTENT_VARIABLES
		{
			%storedStrings0 = v 1.0 APIPX
			%storedStrings1 = 30.09.2026
			%storedStrings2 = MK1 Non-Commercial
			%storedStrings3 = MK1 NON-COMMERCIAL
			%storedStrings4 = COCKPIT
			%storedStrings5 = APP-FIGHTERCOCKPIT
			%storedStrings6 = MK1-NC
			%storedStrings7 = Kerbal Standard
		}
	}
}

