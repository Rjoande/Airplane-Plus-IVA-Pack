PROP:NEEDS[AvionicsSystems]
{
	name = APIP_SignalLamp_SAS

	MODEL
	{
		model = ASET/ASET_Props/Instruments/ASET_SignalLamp/ASET_SignalLamp
	}

	MODULE
	{
		name = MASComponent

		COLOR_SHIFT
		{
			name = Lamp
			transform = LampObj
			passiveColor = 0,30,0,255
			activeColor = 0,255,0,255
			variable = fc.Conditioned(fc.GetSAS())
		}

		MODEL_SCALE
		{
			name = Lamp Off
			transform = LampOFFObj
			startScale = 0, 0, 0
			endScale = -1, -1, -1
			variable = fc.Conditioned(1)
		}

		MODEL_SCALE
		{
			name = Lamp On
			transform = LampObj
			startScale = -1, -1, -1
			endScale = 0, 0, 0
			variable = fc.Conditioned(1)
		}

		TEXT_LABEL
		{
			name = Name
			transform = TopTextObj
			fontSize = 1.5
			lineSpacing = 0.9
			font = Liberation Sans
			style = Bold
			alignment = Center
			anchor = LowerCenter
			emissive = active
			variable = fc.Conditioned(fc.GetPersistentAsNumber("Backlight"))
			blend = true
			activeColor = COLOR_ASET_SWITCHER_NAME_POSITIVECOLOR
			passiveColor = COLOR_ASET_SWITCHER_NAME_ZEROCOLOR
			text = SAS
		}
	}
}

