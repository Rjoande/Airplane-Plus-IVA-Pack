PROP:NEEDS[AvionicsSystems]
{
	name = APIP_IndicatorCircular_EngineTemp

	MODEL
	{
		model = ASET/ASET_Props/Instruments/IndicatorCircular/IndicatorCircular
	}

	MODULE
	{
		name = MASComponent

		ANIMATION
		{
			name = Gauge Animation
			animation = IndicatorCircularAnim
			variable = fc.InverseLerp(fc.HottestEngineTemperature(false), 0, fc.HottestEngineMaxTemperature(false))
		}

		TRANSLATION
		{
			name = Power Off Transformation
			transform = PowerOFFloc
			startTranslation = 0, -0.003, 0
			endTranslation = 0, 0, 0
			variable = fc.Conditioned(1)
		}

		TEXT_LABEL
		{
			name = Readout Caption
			transform = ResourceNameObj
			fontSize = 3.5
			font = Liberation Sans
			alignment = Left
			anchor = LowerLeft
			emissive = always
			transformOffset = 0, -0.008
			passiveColor = 255, 255, 255, 255
			text = Eng Temp:
		}

		TEXT_LABEL
		{
			name = Readout Value
			transform = ResourceAmountObj
			fontSize = 5.4
			font = Liberation Sans
			style = Bold
			alignment = Right
			anchor = UpperRight
			emissive = always
			transformOffset = 0.030, 0
			passiveColor = 255, 246, 0, 255
			text = <=0,6:0=> $#$ fc.HottestEngineTemperature(false)
		}
	}
}

