PROP:NEEDS[AvionicsSystems]
{
	name = APIP_swPush_Engine

	MODEL
	{
		model = Airplane-Plus-Iva-Pack/Props/APIP_PushButtons/SwitchPushButton
	}

	MODULE
	{
		name = MASComponent

		COLLIDER_EVENT
		{
			name = Collider
			collider = SwitchPUSHcollider
			sound = ASET/ASET_Props/Sounds/buttonbeep
			volume = 0.5
			onClick = fc.ToggleEnginesEnabled()
		}

		COLOR_SHIFT
		{
			name = Label Illumination
			transform = SwitchNamePlate
			variable = fc.Conditioned(fc.GetPersistentAsNumber("Backlight"))
			passiveColor = 0,0,0,255
			activeColor = COLOR_ASET_PUSHBUTTON_BACKLIGHT_ACTIVECOLOR
			blend = true
		}

		COLOR_SHIFT
		{
			name = Border Illumination
			transform = buttonBorder
			passiveColor = 0,0,0,255
			activeColor = COLOR_ASET_AG_PUSHBUTTON_ACTIVECOLOR
			variable = fc.Conditioned(fc.GetEnginesEnabled())
		}

		ANIMATION_PLAYER
		{
			name = Switch animation
			animation = SwitchPUSHanim
			animationSpeed = 1.0
			variable = fc.GetEnginesEnabled()
		}

		TEXTURE_SHIFT
		{
			name = Label
			transform = SwitchNamePlate
			layers = _MainTex _Emissive
			startUV = 0.75, 0.00
		}
	}
}

PROP:NEEDS[AvionicsSystems]
